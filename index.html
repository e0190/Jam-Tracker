<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Dashboard - E19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; transition: background-color 2s ease; overflow: hidden; margin: 0; }
        #intro-screen { position: fixed; inset: 0; background: black; display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeOutView 0.8s ease forwards 2.5s; }
        #intro-text { font-size: 6rem; font-weight: 900; letter-spacing: -4px; opacity: 0; animation: fadeInOut 2s ease-in-out forwards 0.3s; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        @keyframes fadeOutView { to { visibility: hidden; opacity: 0; } }
        #setup-overlay { position: fixed; inset: 0; background: black; display: flex; align-items: center; justify-content: center; z-index: 500; opacity: 0; animation: fadeIn 1s ease forwards 3s; }
        @keyframes fadeIn { to { opacity: 1; } }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #main-dashboard { opacity: 0; transition: opacity 1s ease; display: none; }
        .album-art { box-shadow: 0 40px 100px rgba(0,0,0,0.8); border-radius: 8px; }
    </style>
</head>
<body class="h-screen p-12">

    <div id="intro-screen"><div id="intro-text">Made by E19</div></div>

    <div id="setup-overlay">
        <div class="glass p-12 rounded-[50px] max-w-lg w-full text-center border-2 border-white/10 shadow-2xl">
            <h2 class="text-5xl font-black mb-6 uppercase italic tracking-tighter">Enter Jam Link</h2>
            <input type="text" id="jam-input" placeholder="Paste Spotify Link..." 
                class="w-full bg-white/5 border-2 border-white/10 p-6 rounded-3xl mb-6 text-white outline-none focus:border-white transition-all text-center text-xl">
            <button onclick="launch()" class="w-full bg-white text-black font-black p-6 rounded-3xl hover:bg-gray-200 transition-all text-2xl uppercase">Launch</button>
        </div>
    </div>

    <div id="main-dashboard" class="grid grid-cols-12 gap-16 items-start h-full">
        <div class="col-span-7 flex flex-col justify-center h-full pb-24">
            <img id="art" src="" crossorigin="anonymous" class="album-art w-full aspect-square object-cover mb-12">
            <h1 id="title" class="text-[9rem] font-black uppercase tracking-tighter leading-[0.85] italic mb-6">Loading...</h1>
            <p id="artist" class="text-5xl font-medium text-white/60 tracking-tight italic"></p>
        </div>

        <div class="col-span-5 flex flex-col h-full space-y-10">
            <div class="glass rounded-[50px] p-10 flex-grow overflow-hidden flex flex-col">
                <h2 class="text-2xl font-black italic tracking-widest opacity-30 mb-8 uppercase">Queue</h2>
                <div id="queue-list" class="space-y-8 overflow-y-auto pr-4"></div>
            </div>
            <div class="glass rounded-[50px] p-8 flex items-center gap-8 border-l-8 border-white">
                <div id="qrcode" class="bg-white p-3 rounded-3xl"></div>
                <div class="overflow-hidden">
                    <p class="text-sm font-black uppercase tracking-widest text-white/40 mb-2">Scan to Join</p>
                    <p id="jam-display-url" class="text-xl font-mono truncate opacity-60"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'c43fb52c4e2c49499f2802ccd23699fb'; // <--- PUT YOUR ID HERE
        const REDIRECT_URI = window.location.origin + '/';
        const colorThief = new ColorThief();

        function launch() {
            const jamLink = document.getElementById('jam-input').value;
            if (!jamLink) return alert("Enter a link!");
            sessionStorage.setItem('temp_jam', jamLink);

            // OAuth Step 1: Request code
            const scope = 'user-read-currently-playing user-read-playback-state';
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}`;
        }

        async function updateTheme() {
            const img = document.getElementById('art');
            if (img.complete && img.src.includes('scdn.co')) {
                const color = colorThief.getColor(img);
                document.body.style.backgroundColor = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
            }
        }

        async function fetchSpotify(token) {
            const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 200) {
                const data = await res.json();
                if (document.getElementById('title').innerText !== data.item.name) {
                    document.getElementById('title').innerText = data.item.name;
                    document.getElementById('artist').innerText = data.item.artists[0].name;
                    document.getElementById('art').src = data.item.album.images[0].url;
                    updateTheme();
                }
            }
        }

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const jam = sessionStorage.getItem('temp_jam');

            if (code && jam) {
                // Skip setup and show dashboard
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('setup-overlay').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'grid';
                document.getElementById('main-dashboard').style.opacity = '1';
                document.getElementById('jam-display-url').innerText = jam;
                new QRCode(document.getElementById("qrcode"), { text: jam, width: 140, height: 140 });

                // Step 2: Swap code for token using our Vercel API
                const tokenRes = await fetch('/api/get-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, redirect_uri: REDIRECT_URI })
                });
                const tokenData = await tokenRes.json();
                
                if (tokenData.access_token) {
                    fetchSpotify(tokenData.access_token);
                    setInterval(() => fetchSpotify(tokenData.access_token), 4000);
                }
            }
        };
    </script>
</body>
</html>
