<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Dashboard - E19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; transition: background-color 1.5s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .bebas { font-family: 'Bebas Neue', cursive; }
        .glass { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(50px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        #intro-screen { position: fixed; inset: 0; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; pointer-events: none; transition: opacity 1s ease; }
        #intro-text { font-size: 2rem; opacity: 0; animation: fadeInOut 2.5s ease-in-out forwards; letter-spacing: 0.5em; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: scale(0.95); } 40% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }

        .art-container { width: 35vw; height: 35vw; max-width: 450px; max-height: 450px; flex-shrink: 0; margin: 0 auto; position: relative; }
        .album-art { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.15); position: relative; z-index: 2; }
        #art-glow { position: absolute; inset: -30px; filter: blur(100px); opacity: 0.7; z-index: 1; border-radius: 50%; transition: background 2s ease; }

        .title-text { font-size: clamp(2.5rem, 6vw, 6rem); line-height: 0.8; word-break: break-word; }
        .progress-bg { height: 8px; background: rgba(255,255,255,0.1); border-radius: 20px; width: 100%; position: relative; overflow: hidden; }
        #progress-fill { height: 100%; background: white; border-radius: 20px; width: 0%; transition: width 0.5s linear; }

        .queue-item { cursor: pointer; transition: all 0.3s ease; border-radius: 20px; border: 1px solid transparent; }
        .queue-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.1); transform: translateX(10px); }
        
        #setup-overlay { position: fixed; inset: 0; background: black; z-index: 1000; display: none; align-items: center; justify-content: center; }
        .toggle-card { background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .toggle-card:has(input:checked) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        input[type="checkbox"] { width: 24px; height: 24px; accent-color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div id="intro-text" class="bebas">MADE BY E19</div>
    </div>

    <div id="setup-overlay">
        <div class="glass p-12 rounded-[60px] max-w-xl w-full border-2 border-white/5 mx-4">
            <h2 class="text-5xl bebas mb-8 tracking-tight italic text-center">DASHBOARD CONFIG</h2>
            <div class="space-y-4 mb-10">
                <input type="text" id="jam-input" placeholder="PASTE JAM LINK" 
                    class="w-full bg-white/5 border-2 border-white/10 p-6 rounded-[30px] text-white outline-none focus:border-white transition-all text-center text-xl bebas tracking-widest mb-4">
                <div class="grid grid-cols-2 gap-4">
                    <label class="toggle-card"><span class="bebas text-xl">PLAY BUTTONS</span><input type="checkbox" id="check-controls" checked></label>
                    <label class="toggle-card"><span class="bebas text-xl">PROGRESS BAR</span><input type="checkbox" id="check-progress" checked></label>
                    <label class="toggle-card"><span class="bebas text-xl">QUEUE</span><input type="checkbox" id="check-queue" checked></label>
                    <label class="toggle-card"><span class="bebas text-xl">JAM QR</span><input type="checkbox" id="check-jam" checked></label>
                </div>
            </div>
            <button onclick="launch()" class="w-full bg-white text-black font-black p-6 rounded-[30px] hover:scale-[1.02] active:scale-[0.98] transition-all text-2xl bebas tracking-tighter uppercase italic">
                Connect & Launch
            </button>
        </div>
    </div>

    <div id="main-dashboard" class="grid grid-cols-12 gap-12 w-full h-full max-w-[1800px] px-16 items-center" style="display: none; opacity: 0; transition: opacity 1.5s ease;">
        <div id="player-section" class="col-span-7 flex flex-col text-center">
            <div class="art-container mb-12">
                <div id="art-glow"></div>
                <img id="art" src="" crossorigin="anonymous" class="album-art">
            </div>
            <div class="flex flex-col gap-2 px-10 items-center">
                <h1 id="title" class="bebas title-text tracking-tighter uppercase italic">Waiting...</h1>
                <p id="artist" class="text-3xl font-bold opacity-40 italic tracking-tight mb-8"></p>
                <div id="progress-container" class="flex items-center gap-6 w-full max-w-3xl">
                    <span id="time-cur" class="text-sm opacity-50 font-mono">0:00</span>
                    <div class="progress-bg"><div id="progress-fill"></div></div>
                    <span id="time-total" class="text-sm opacity-50 font-mono">0:00</span>
                </div>
                <div id="controls-container" class="flex items-center justify-center gap-16 mt-10">
                    <button onclick="control('previous')" class="opacity-40 hover:opacity-100 hover:scale-125 transition-all"><svg width="50" height="50" fill="white" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
                    <button onclick="control('toggle')" id="play-btn" class="bg-white rounded-full p-8 hover:scale-110 active:scale-95 transition-all shadow-2xl"><svg id="play-icon" width="50" height="50" fill="black" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                    <button onclick="control('next')" class="opacity-40 hover:opacity-100 hover:scale-125 transition-all"><svg width="50" height="50" fill="white" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>
                </div>
            </div>
        </div>
        <div id="sidebar-section" class="col-span-5 flex flex-col h-[85vh] gap-8">
            <div id="queue-card" class="glass rounded-[60px] p-12 flex-grow overflow-hidden flex flex-col">
                <h2 class="bebas text-3xl opacity-20 mb-8 tracking-[0.4em] uppercase italic text-center">Up Next</h2>
                <div id="queue-list" class="space-y-6"></div>
            </div>
            <div id="jam-card" class="glass rounded-[60px] p-8 flex items-center gap-10 border-l-[12px] border-white">
                <div id="qrcode" class="bg-white p-3 rounded-3xl shadow-2xl"></div>
                <div class="overflow-hidden">
                    <p class="bebas text-xl opacity-30 tracking-widest uppercase mb-1">Join Jam</p>
                    <p id="jam-display-url" class="text-sm font-mono truncate opacity-40 font-bold"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'c43fb52c4e2c49499f2802ccd23699fb';
        const REDIRECT_URI = window.location.origin + '/';
        let accessToken = null;
        let refreshToken = sessionStorage.getItem('refresh_token');
        let tokenExpires = 0;
        let config = {};
        let isPlaying = false;
        let lastArtUrl = null;
        let loopTimer = null;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            // Remove ?code= from the address bar so refreshing the page doesn't reuse a spent code
            if (code || urlParams.get('error')) history.replaceState(null, '', window.location.pathname);
            setTimeout(() => {
                document.getElementById('intro-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('intro-screen').style.display = 'none';
                    if (code) exchangeToken(code);
                    else if (refreshToken) refreshAccess().then(ok => ok ? startApp() : showSetup());
                    else showSetup();
                }, 1000);
            }, 2600);
        };

        function showSetup() {
            document.getElementById('setup-overlay').style.display = 'flex';
        }

        function launch() {
            const jamLink = document.getElementById('jam-input').value.trim();
            const wantsJam = document.getElementById('check-jam').checked;
            if (wantsJam && !jamLink) return alert("Please paste a Jam link first!");
            config = { controls: document.getElementById('check-controls').checked, progress: document.getElementById('check-progress').checked, queue: document.getElementById('check-queue').checked, jam: wantsJam };
            sessionStorage.setItem('jam_link', jamLink);
            sessionStorage.setItem('dash_config', JSON.stringify(config));
            const scope = encodeURIComponent('user-read-currently-playing user-read-playback-state user-modify-playback-state');
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${scope}`;
        }

        function saveTokens(data) {
            accessToken = data.access_token;
            tokenExpires = Date.now() + (data.expires_in || 3600) * 1000;
            if (data.refresh_token) {
                refreshToken = data.refresh_token;
                sessionStorage.setItem('refresh_token', refreshToken);
            }
        }

        async function exchangeToken(code) {
            try {
                const res = await fetch('/api/token', { method: 'POST', body: JSON.stringify({ code, redirect_uri: REDIRECT_URI }), headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (res.ok && data.access_token) { saveTokens(data); startApp(); }
                else showSetup();
            } catch (e) { showSetup(); }
        }

        async function refreshAccess() {
            if (!refreshToken) return false;
            try {
                const res = await fetch('/api/token', { method: 'POST', body: JSON.stringify({ refresh_token: refreshToken }), headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (res.ok && data.access_token) { saveTokens(data); return true; }
            } catch (e) { console.error(e); }
            sessionStorage.removeItem('refresh_token');
            refreshToken = null;
            return false;
        }

        // Every Spotify call goes through here: gets a new token when the old one is about to expire or gets rejected
        async function spotify(path, options = {}) {
            if (Date.now() > tokenExpires - 60000) await refreshAccess();
            const call = () => fetch('https://api.spotify.com/v1/me/player' + path, { ...options, headers: { 'Authorization': `Bearer ${accessToken}` } });
            let res = await call();
            if (res.status === 401 && await refreshAccess()) res = await call();
            return res;
        }

        function startApp() {
            config = JSON.parse(sessionStorage.getItem('dash_config')) || { controls: true, progress: true, queue: true, jam: true };
            document.getElementById('setup-overlay').style.display = 'none';
            if (!config.controls) document.getElementById('controls-container').style.display = 'none';
            if (!config.progress) document.getElementById('progress-container').style.display = 'none';
            if (!config.queue && !config.jam) {
                document.getElementById('sidebar-section').style.display = 'none';
                document.getElementById('player-section').className = 'col-span-12 flex flex-col text-center';
            } else {
                if (!config.queue) document.getElementById('queue-card').style.display = 'none';
                if (!config.jam) document.getElementById('jam-card').style.display = 'none';
            }
            document.getElementById('main-dashboard').style.display = 'grid';
            setTimeout(() => document.getElementById('main-dashboard').style.opacity = '1', 50);
            const jam = sessionStorage.getItem('jam_link');
            if (jam && config.jam) {
                document.getElementById('jam-display-url').innerText = jam;
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById("qrcode"), { text: jam, width: 130, height: 130 });
            }
            updateLoop();
        }

        // Only one loop ever runs: calling this again restarts the timer instead of starting a second loop
        async function updateLoop() {
            clearTimeout(loopTimer);
            if (!accessToken) return;
            await fetchPlayback();
            if (config.queue) await fetchQueue();
            clearTimeout(loopTimer);
            loopTimer = setTimeout(updateLoop, 3000);
        }

        async function fetchPlayback() {
            try {
                const res = await spotify('/currently-playing?additional_types=episode');
                if (res.status === 204) { isPlaying = false; setPlayIcon(); return; } // nothing playing
                if (res.status !== 200) return;
                const data = await res.json();
                isPlaying = data.is_playing;
                setPlayIcon();
                const item = data.item;
                if (!item) return; // ads have no song info
                document.getElementById('title').innerText = item.name;
                document.getElementById('artist').innerText = artistName(item);
                const images = (item.album || item).images || [];
                const newUrl = images[0] && images[0].url;
                if (newUrl && newUrl !== lastArtUrl) {
                    lastArtUrl = newUrl;
                    const img = document.getElementById('art');
                    img.crossOrigin = "anonymous";
                    img.onload = () => updateVibeColors(img);
                    img.src = newUrl;
                }

                const percent = Math.min(100, (data.progress_ms / item.duration_ms) * 100);
                document.getElementById('progress-fill').style.width = percent + '%';
                document.getElementById('time-cur').innerText = formatTime(data.progress_ms);
                document.getElementById('time-total').innerText = formatTime(item.duration_ms);
            } catch (e) { console.error(e); }
        }

        function artistName(item) {
            if (item.artists) return item.artists.map(a => a.name).join(', ');
            return item.show ? item.show.name : '';
        }

        function setPlayIcon() {
            document.getElementById('play-icon').innerHTML = isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
        }

        function updateVibeColors(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 50; canvas.height = 50; // Downscale for processing
            try {
                ctx.drawImage(img, 0, 0, 50, 50);
                const imageData = ctx.getImageData(0, 0, 50, 50).data;
                let bestColor = {r: 0, g: 0, b: 0, score: -1};

                // Sample pixels to find the most "vibrant" vibe (high saturation + reasonable brightness)
                for (let i = 0; i < imageData.length; i += 16) {
                    const r = imageData[i], g = imageData[i+1], b = imageData[i+2];

                    // Simple saturation score
                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const saturation = (max === 0) ? 0 : (max - min) / max;
                    const brightness = max / 255;

                    // We want colors that are colorful but not too dark or purely white
                    const score = saturation * brightness;

                    if (score > bestColor.score && brightness > 0.1 && brightness < 0.9) {
                        bestColor = {r, g, b, score};
                    }
                }

                // If the image is super muted/dark, boost the winner
                let {r, g, b} = bestColor;
                if (bestColor.score < 0.2) { r = Math.min(255, r + 30); g = Math.min(255, g + 30); b = Math.min(255, b + 30); }

                const finalColor = `rgb(${r}, ${g}, ${b})`;
                document.body.style.backgroundColor = finalColor;
                document.getElementById('art-glow').style.background = finalColor;
            } catch (e) {
                document.body.style.backgroundColor = '#121212';
            }
        }

        async function fetchQueue() {
            try {
                const res = await spotify('/queue');
                if (res.status === 200) {
                    const data = await res.json();
                    const container = document.getElementById('queue-list');
                    container.innerHTML = '';
                    (data.queue || []).slice(0, 5).forEach((track, index) => {
                        const div = document.createElement('div');
                        div.className = 'queue-item flex items-center gap-6 p-4';
                        div.onclick = () => playSpecific(index);
                        div.innerHTML = `<img class="w-20 h-20 rounded-2xl shadow-lg"><div class="overflow-hidden"><p class="bebas text-3xl truncate leading-none mb-2"></p><p class="text-sm opacity-40 truncate uppercase font-bold tracking-widest"></p></div>`;
                        // textContent, not innerHTML, so names with < or & show correctly
                        const images = (track.album || track).images || [];
                        const thumb = images[images.length - 1];
                        if (thumb) div.querySelector('img').src = thumb.url;
                        const lines = div.querySelectorAll('p');
                        lines[0].textContent = track.name;
                        lines[1].textContent = artistName(track);
                        container.appendChild(div);
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function control(cmd) {
            const method = (cmd === 'next' || cmd === 'previous') ? 'POST' : 'PUT';
            const endpoint = cmd === 'toggle' ? (isPlaying ? 'pause' : 'play') : cmd;
            if (cmd === 'toggle') { isPlaying = !isPlaying; setPlayIcon(); }
            await spotify('/' + endpoint, { method });
            setTimeout(updateLoop, 400);
        }

        // Skip ahead to the clicked song. Playing its URI directly would wipe out the rest of the queue and the Jam.
        async function playSpecific(index) {
            for (let i = 0; i <= index; i++) await spotify('/next', { method: 'POST' });
            setTimeout(updateLoop, 400);
        }

        function formatTime(ms) {
            const total = Math.floor(ms / 1000);
            const sec = total % 60;
            return Math.floor(total / 60) + ":" + (sec < 10 ? '0' : '') + sec;
        }
    </script>
</body>
</html>
