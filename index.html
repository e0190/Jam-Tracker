<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Dashboard - E19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        body { 
            background-color: #000; 
            color: white; 
            font-family: 'Inter', sans-serif;
            transition: background-color 2s ease;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        #intro-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeOutView 0.8s ease forwards 2.5s;
        }

        #intro-text {
            font-size: 5vw;
            font-weight: 900;
            letter-spacing: -4px;
            opacity: 0;
            animation: fadeInOut 2s ease-in-out forwards 0.3s;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        @keyframes fadeOutView {
            to { visibility: hidden; opacity: 0; }
        }

        #setup-overlay {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            opacity: 0;
            animation: fadeIn 1s ease forwards 3s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        #main-dashboard {
            opacity: 0;
            transition: opacity 1s ease;
            display: none;
            height: 100vh;
        }

        .album-art { 
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border-radius: 12px;
            max-height: 55vh; /* Prevents it from being too tall */
            width: auto;
        }

        #queue-list::-webkit-scrollbar { width: 4px; }
        #queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="p-8">

    <div id="intro-screen">
        <div id="intro-text">Made by E19</div>
    </div>

    <div id="setup-overlay">
        <div class="glass p-10 rounded-[40px] max-w-md w-full text-center border-2 border-white/10 shadow-2xl">
            <h2 class="text-4xl font-black mb-4 uppercase italic tracking-tighter">Enter Jam Link</h2>
            <input type="text" id="jam-input" placeholder="Paste Spotify Link..." 
                class="w-full bg-white/5 border-2 border-white/10 p-4 rounded-2xl mb-6 text-white outline-none focus:border-white transition-all text-center text-lg">
            <button onclick="launch()" class="w-full bg-white text-black font-black p-4 rounded-2xl hover:bg-gray-200 transition-all text-xl uppercase tracking-tight">
                Launch Dashboard
            </button>
        </div>
    </div>

    <div id="main-dashboard" class="grid grid-cols-12 gap-8 items-center">
        <div class="col-span-7 flex flex-col justify-center h-full">
            <img id="art" src="https://via.placeholder.com/600" crossorigin="anonymous" class="album-art aspect-square object-cover mb-8">
            <div>
                <h1 id="title" class="text-[6vw] font-black uppercase tracking-tighter leading-[0.9] italic mb-4">Not Playing</h1>
                <p id="artist" class="text-3xl font-medium text-white/60 tracking-tight italic">Waiting for Spotify...</p>
            </div>
        </div>

        <div class="col-span-5 flex flex-col h-[85vh] space-y-6">
            <div class="glass rounded-[40px] p-8 flex-grow overflow-hidden flex flex-col">
                <h2 class="text-lg font-black italic tracking-[0.2em] opacity-30 mb-6 uppercase">Queue</h2>
                <div id="queue-list" class="space-y-6 overflow-y-auto pr-2">
                    <div class="flex items-center gap-4 opacity-20">
                        <div class="w-12 h-12 bg-white/10 rounded-lg"></div>
                        <div class="h-3 bg-white/10 w-24 rounded"></div>
                    </div>
                </div>
            </div>

            <div class="glass rounded-[40px] p-6 flex items-center gap-6 border-l-4 border-white">
                <div id="qrcode" class="bg-white p-2 rounded-2xl shadow-xl"></div>
                <div class="overflow-hidden">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/40 mb-1">Scan to Join Jam</p>
                    <p id="jam-display-url" class="text-sm font-mono truncate opacity-60"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'c43fb52c4e2c49499f2802ccd23699fb'; // <--- MUST BE YOUR REAL ID
        const REDIRECT_URI = window.location.origin + '/';
        const colorThief = new ColorThief();

        function launch() {
            const jamLink = document.getElementById('jam-input').value;
            if (!jamLink) return alert("Enter a valid link!");

            document.getElementById('setup-overlay').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'grid';
            setTimeout(() => { document.getElementById('main-dashboard').style.opacity = '1'; }, 50);

            document.getElementById('jam-display-url').innerText = jamLink;
            document.getElementById('qrcode').innerHTML = ""; 
            new QRCode(document.getElementById("qrcode"), { 
                text: jamLink, 
                width: 100, 
                height: 100
            });

            // OAuth Check
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (!code) {
                sessionStorage.setItem('temp_jam', jamLink);
                login();
            } else {
                exchangeToken(code);
            }
        }

        function login() {
            const scope = 'user-read-currently-playing user-read-playback-state';
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}`;
        }

        async function exchangeToken(code) {
            const res = await fetch('/api/token', {
                method: 'POST',
                body: JSON.stringify({ code, redirect_uri: REDIRECT_URI }),
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json();
            if (data.access_token) {
                startTracking(data.access_token);
            }
        }

        async function updateTheme() {
            const img = document.getElementById('art');
            if (img.complete && img.src.includes('scdn.co')) {
                const color = colorThief.getColor(img);
                document.body.style.backgroundColor = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
            }
        }

        async function fetchSpotify(token) {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 200) {
                    const data = await res.json();
                    if (document.getElementById('title').innerText !== data.item.name) {
                        document.getElementById('title').innerText = data.item.name;
                        document.getElementById('artist').innerText = data.item.artists[0].name;
                        document.getElementById('art').src = data.item.album.images[0].url;
                        updateTheme();
                    }
                }
            } catch (e) { console.error(e); }
        }

        function startTracking(token) {
            fetchSpotify(token);
            setInterval(() => fetchSpotify(token), 4000);
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('code')) {
                const savedJam = sessionStorage.getItem('temp_jam');
                if (savedJam) {
                    document.getElementById('jam-input').value = savedJam;
                    launch();
                }
            }
        };
    </script>
</body>
</html>
