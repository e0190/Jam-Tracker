<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Dashboard - E19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; transition: background-color 1.5s ease, color 0.5s ease; overflow: hidden; height: 100vh; width: 100vw; margin: 0; display: flex; align-items: center; justify-content: center; }
        .bebas { font-family: 'Bebas Neue', cursive; }
        .glass { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        #intro-screen { position: fixed; inset: 0; background: black; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        #intro-text { font-size: 10vw; opacity: 0; animation: fadeInOut 2s ease-in-out forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }

        .art-container { width: 45vh; height: 45vh; max-width: 600px; max-height: 600px; flex-shrink: 0; transition: all 0.8s ease; }
        .album-art { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; box-shadow: 0 50px 120px rgba(0,0,0,0.8); }

        .title-text { font-size: clamp(3rem, 7vw, 8rem); line-height: 0.8; word-break: break-word; }
        .progress-bg { height: 10px; background: rgba(128,128,128,0.2); border-radius: 20px; width: 100%; }
        #progress-fill { height: 100%; background: currentColor; border-radius: 20px; width: 0%; transition: width 0.5s linear; }

        #setup-overlay { position: fixed; inset: 0; background: black; z-index: 1000; display: none; align-items: center; justify-content: center; overflow-y: auto; }
        
        .check-card { cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .check-card:hover:not(.disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .disabled { opacity: 0.2; cursor: not-allowed; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: white; cursor: pointer; }

        #main-dashboard.full-centered { flex-direction: column; text-align: center; }
        #main-dashboard.full-centered .art-container { width: 55vh; height: 55vh; }
    </style>
</head>
<body>

    <div id="intro-screen"><div id="intro-text" class="bebas">MADE BY E19</div></div>

    <div id="setup-overlay">
        <div class="glass p-10 rounded-[60px] max-w-3xl w-full border-2 border-white/10 mx-4 my-10">
            <h2 class="text-6xl bebas mb-8 text-center italic tracking-tight">E19 DASHBOARD</h2>
            
            <div class="space-y-4 mb-10">
                <div id="jam-input-area">
                    <label class="bebas text-2xl opacity-50 block mb-2 px-2 uppercase">Spotify Jam Link</label>
                    <input type="text" id="jam-input" oninput="toggleQRCheck()" placeholder="PASTE LINK HERE" 
                        class="w-full bg-white/5 border border-white/10 p-6 rounded-[35px] text-white outline-none focus:border-white transition-all text-center text-xl">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="check-card flex items-center justify-between p-6 rounded-[30px] glass">
                        <span class="bebas text-2xl uppercase italic">Show Queue</span>
                        <input type="checkbox" id="show-queue" checked>
                    </label>
                    <label id="qr-label" class="check-card flex items-center justify-between p-6 rounded-[30px] glass disabled">
                        <span class="bebas text-2xl uppercase italic">Show Jam QR</span>
                        <input type="checkbox" id="show-jam" disabled>
                    </label>
                    <label class="check-card flex items-center justify-between p-6 rounded-[30px] glass">
                        <span class="bebas text-2xl uppercase italic">Playback Controls</span>
                        <input type="checkbox" id="show-controls" checked>
                    </label>
                    <label class="check-card flex items-center justify-between p-6 rounded-[30px] glass">
                        <span class="bebas text-2xl uppercase italic">Dynamic Background</span>
                        <input type="checkbox" id="use-colors" checked>
                    </label>
                    <label class="check-card flex items-center justify-between p-6 rounded-[30px] glass">
                        <span class="bebas text-2xl uppercase italic">Progress Bar</span>
                        <input type="checkbox" id="show-progress" checked>
                    </label>
                    <label class="check-card flex items-center justify-between p-6 rounded-[30px] glass">
                        <span class="bebas text-2xl uppercase italic">Artist Name</span>
                        <input type="checkbox" id="show-artist" checked>
                    </label>
                </div>
            </div>

            <button onclick="launch()" class="w-full bg-white text-black font-black p-6 rounded-[35px] hover:bg-gray-200 transition-all text-4xl bebas uppercase italic">
                Launch Dashboard
            </button>
        </div>
    </div>

    <div id="main-dashboard" class="flex flex-row items-center justify-center gap-24 w-full h-full px-16 transition-all duration-1000" style="display: none; opacity: 0;">
        
        <div id="player-unit" class="flex flex-col items-center text-center flex-grow max-w-4xl transition-all duration-700">
            <div class="art-container mb-12">
                <img id="art" src="" crossorigin="anonymous" class="album-art">
            </div>
            
            <div class="flex flex-col gap-4 w-full items-center">
                <h1 id="title" class="bebas title-text tracking-tighter uppercase italic">Waiting...</h1>
                <p id="artist" class="text-4xl font-bold opacity-60 italic tracking-tight mb-8"></p>
                
                <div id="progress-container" class="flex items-center gap-6 w-full max-w-3xl mb-6">
                    <span id="time-cur" class="text-sm opacity-50 font-mono">0:00</span>
                    <div class="progress-bg"><div id="progress-fill"></div></div>
                    <span id="time-total" class="text-sm opacity-50 font-mono">0:00</span>
                </div>

                <div id="control-hub" class="flex items-center justify-center gap-16 mt-4">
                    <button onclick="control('previous')" class="hover:scale-125 transition-all opacity-60 hover:opacity-100"><svg width="55" height="55" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
                    <button onclick="control('toggle')" id="play-btn" class="bg-current rounded-full p-8 hover:scale-110 transition-all shadow-2xl"><svg id="play-icon" width="55" height="55" fill="black" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                    <button onclick="control('next')" class="hover:scale-125 transition-all opacity-60 hover:opacity-100"><svg width="55" height="55" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>
                </div>
            </div>
        </div>

        <div id="sidebar-unit" class="flex flex-col h-[90vh] gap-8 w-[500px] flex-shrink-0 transition-all duration-700">
            <div id="queue-card" class="glass rounded-[60px] p-12 flex-grow overflow-hidden flex flex-col">
                <h2 class="bebas text-3xl opacity-20 mb-8 tracking-[0.4em] uppercase italic">Up Next</h2>
                <div id="queue-list" class="space-y-6"></div>
            </div>

            <div id="jam-card" class="glass rounded-[60px] p-10 flex items-center gap-10 border-l-[12px] border-white">
                <div id="qrcode" class="bg-white p-2 rounded-3xl"></div>
                <div class="overflow-hidden">
                    <p class="bebas text-2xl opacity-30 tracking-widest uppercase mb-2">Join Jam</p>
                    <p id="jam-display-url" class="text-sm font-mono truncate opacity-40 font-bold"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'c43fb52c4e2c49499f2802ccd23699fb';
        const REDIRECT_URI = window.location.origin + '/';
        const colorThief = new ColorThief();
        let accessToken = null;
        let config = {};
        let lastTrackId = null;

        function toggleQRCheck() {
            const val = document.getElementById('jam-input').value;
            const qrCheck = document.getElementById('show-jam');
            const qrLabel = document.getElementById('qr-label');
            if (val.trim().length > 5) {
                qrCheck.disabled = false;
                qrLabel.classList.remove('disabled');
            } else {
                qrCheck.disabled = true;
                qrCheck.checked = false;
                qrLabel.classList.add('disabled');
            }
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                if (code) {
                    config = JSON.parse(sessionStorage.getItem('dash_config') || '{}');
                    exchangeToken(code);
                } else {
                    document.getElementById('setup-overlay').style.display = 'flex';
                }
            }, 2500);
        };

        function launch() {
            config = {
                jam: document.getElementById('jam-input').value,
                queue: document.getElementById('show-queue').checked,
                qr: document.getElementById('show-jam').checked,
                controls: document.getElementById('show-controls').checked,
                bg: document.getElementById('use-colors').checked,
                progress: document.getElementById('show-progress').checked,
                artist: document.getElementById('show-artist').checked
            };
            sessionStorage.setItem('dash_config', JSON.stringify(config));
            const scope = encodeURIComponent('user-read-currently-playing user-read-playback-state user-modify-playback-state');
            window.location.href = `https://accounts.spotify.com/authorize?response_type=code&client_id=${CLIENT_ID}&scope=${scope}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
        }

        async function exchangeToken(code) {
            const res = await fetch('/api/token', { method: 'POST', body: JSON.stringify({ code, redirect_uri: REDIRECT_URI }), headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            if (data.access_token) {
                accessToken = data.access_token;
                applyConfig();
                updateLoop();
            }
        }

        function applyConfig() {
            document.getElementById('setup-overlay').style.display = 'none';
            const dash = document.getElementById('main-dashboard');
            dash.style.display = 'flex';
            setTimeout(() => dash.style.opacity = '1', 50);
            
            if (!config.queue && !config.qr) {
                document.getElementById('sidebar-unit').style.display = 'none';
                dash.classList.add('full-centered');
            } else {
                if (!config.queue) document.getElementById('queue-card').style.display = 'none';
                if (!config.qr) document.getElementById('jam-card').style.display = 'none';
            }

            if (!config.controls) document.getElementById('control-hub').style.display = 'none';
            if (!config.progress) document.getElementById('progress-container').style.display = 'none';
            if (!config.artist) document.getElementById('artist').style.display = 'none';
            
            if (config.qr) {
                document.getElementById('jam-display-url').innerText = config.jam;
                new QRCode(document.getElementById("qrcode"), { text: config.jam, width: 140, height: 140 });
            }
        }

        async function updateLoop() {
            await fetchPlayback();
            // Queue is only fetched if config allows OR if the track changed
            setTimeout(updateLoop, 3000);
        }

        async function fetchPlayback() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (res.status === 200) {
                    const data = await res.json();
                    document.getElementById('title').innerText = data.item.name;
                    document.getElementById('artist').innerText = data.item.artists[0].name;

                    // Trigger Queue Sync if track changed
                    if (data.item.id !== lastTrackId) {
                        lastTrackId = data.item.id;
                        if (config.queue) fetchQueue();
                    }

                    const img = document.getElementById('art');
                    if (img.src !== data.item.album.images[0].url) {
                        img.src = data.item.album.images[0].url;
                        img.onload = () => {
                            if (config.bg) {
                                const color = colorThief.getColor(img);
                                document.body.style.backgroundColor = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                                const brightness = (color[0] * 299 + color[1] * 587 + color[2] * 114) / 1000;
                                document.body.style.color = brightness > 180 ? 'black' : 'white';
                                document.getElementById('play-btn').querySelector('svg').style.fill = brightness > 180 ? 'white' : 'black';
                            }
                        };
                    }
                    const percent = (data.progress_ms / data.item.duration_ms) * 100;
                    document.getElementById('progress-fill').style.width = percent + '%';
                    document.getElementById('time-cur').innerText = formatTime(data.progress_ms);
                    document.getElementById('time-total').innerText = formatTime(data.item.duration_ms);
                    document.getElementById('play-icon').innerHTML = data.is_playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
                }
            } catch (e) { console.error("Playback Fetch Error", e); }
        }

        async function fetchQueue() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/queue', { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (res.status === 200) {
                    const data = await res.json();
                    const container = document.getElementById('queue-list');
                    container.innerHTML = '';
                    
                    // Filters out the current playing song from the queue list to keep it truly "Up Next"
                    data.queue.slice(0, 5).forEach(track => {
                        const div = document.createElement('div');
                        div.className = 'flex items-center gap-6 p-4 hover:bg-white/10 cursor-pointer rounded-3xl transition-all';
                        div.onclick = () => playSpecific(track.uri);
                        div.innerHTML = `<img src="${track.album.images[2].url}" class="w-16 h-16 rounded-2xl shadow-lg"><div class="overflow-hidden text-left"><p class="bebas text-3xl truncate leading-none mb-1">${track.name}</p><p class="text-sm opacity-40 truncate uppercase font-bold tracking-widest">${track.artists[0].name}</p></div>`;
                        container.appendChild(div);
                    });
                }
            } catch (e) { console.error("Queue Sync Error", e); }
        }

        async function control(cmd) {
            let method = (cmd === 'next' || cmd === 'previous') ? 'POST' : 'PUT';
            let endpoint = cmd;
            if (cmd === 'toggle') {
                const s = await (await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { 'Authorization': `Bearer ${accessToken}` } })).json();
                endpoint = s.is_playing ? 'pause' : 'play';
            }
            await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, { method: method, headers: { 'Authorization': `Bearer ${accessToken}` } });
            
            // Forces immediate sync after control
            setTimeout(() => {
                fetchPlayback();
                if (config.queue) fetchQueue();
            }, 600);
        }

        async function playSpecific(uri) {
            await fetch('https://api.spotify.com/v1/me/player/play', { 
                method: 'PUT', 
                headers: { 'Authorization': `Bearer ${accessToken}` }, 
                body: JSON.stringify({ uris: [uri] }) 
            });
            setTimeout(() => {
                fetchPlayback();
                if (config.queue) fetchQueue();
            }, 600);
        }

        function formatTime(ms) {
            const min = Math.floor(ms / 60000);
            const sec = ((ms % 60000) / 1000).toFixed(0);
            return min + ":" + (sec < 10 ? '0' : '') + sec;
        }
    </script>
</body>
</html>
